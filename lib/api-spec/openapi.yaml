openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: archon
    description: Archon public release readiness
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /archon/status:
    get:
      operationId: getArchonPublicStatus
      tags: [archon]
      summary: Get Archon public inference readiness
      description: Reports the public release candidate and whether inference is approved and available.
      responses:
        "200":
          description: Current public inference readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchonPublicStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ArchonPublicStatus:
      type: object
      properties:
        availability:
          type: string
          enum: [unavailable]
        publicUseApproved:
          type: boolean
          enum: [false]
        releaseVersion:
          type: string
        codename:
          type: string
        releaseStatus:
          type: string
          enum: [planned-release-candidate]
        firstTarget:
          type: string
        modelDirection:
          type: string
        checkpoint:
          type: ["string", "null"]
        textFormat:
          type: object
          properties:
            codecId:
              type: string
            status:
              type: string
              enum: [planned-not-bound-to-checkpoint]
            description:
              type: string
          required: [codecId, status, description]
        blockers:
          type: array
          items:
            type: string
      required:
        - availability
        - publicUseApproved
        - releaseVersion
        - codename
        - releaseStatus
        - firstTarget
        - modelDirection
        - checkpoint
        - textFormat
        - blockers

